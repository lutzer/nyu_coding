<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Augmenting the Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <img class="logo" src="logo.svg" alt="Gallery" />
      <nav>
        <a href="#">Works</a>
        <a href="#">Artists</a>
        <a href="#">About</a>
        <a href="#">Visit</a>
      </nav>
    </header>

    <section class="hero">
      <h1>Augmenting the Gallery</h1>
      <p>A hybrid space for artworks</p>
    </section>

    <div class="filters">
      <button class="filter-button is-active">All</button>
      <button class="filter-button">Paintings</button>
      <button class="filter-button">Sculptures</button>
    </div>

    <main>
      <div class="grid">
        <div class="card">
          <img src="images/art1.jpg" alt="" />
          <p class="caption">Untitled #1</p>
        </div>
        <div class="card">
          <img src="images/art2.jpg" alt="" />
          <p class="caption">Untitled #2</p>
        </div>
        <div class="card">
          <img src="images/art3.jpg" alt="" />
          <p class="caption">Untitled #3</p>
        </div>
        <div class="card">
          <img src="images/art4.jpg" alt="" />
          <p class="caption">Untitled #4</p>
        </div>
        <div class="card">
          <img src="images/art5.jpg" alt="" />
          <p class="caption">Untitled #5</p>
        </div>
        <div class="card">
          <img src="images/art6.jpg" alt="" />
          <p class="caption">Untitled #6</p>
        </div>
        <div class="card">
          <img src="images/art7.jpg" alt="" />
          <p class="caption">Untitled #7</p>
        </div>
        <div class="card">
          <img src="images/art8.jpg" alt="" />
          <p class="caption">Untitled #8</p>
        </div>
        <div class="card">
          <img src="images/art9.jpg" alt="" />
          <p class="caption">Untitled #9</p>
        </div>
      </div>
    </main>

    <footer>
      <p>&copy; Gallery &middot; Augmenting the Space</p>
    </footer>
  </body>
</html>
