<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Gallery — starter</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <img class="logo" src="logo.svg" alt="Gallery" />
      <nav>
        <a href="#">Works</a>
        <a href="#">Artists</a>
        <a href="#">About</a>
        <a href="#">Visit</a>
      </nav>
    </header>

    <section class="hero">
      <h1>Augmenting the Gallery</h1>
      <p>A hybrid space for artworks</p>
    </section>

    <div class="filters">
      <button class="filter-button" style="background: #FF9100">All</button>
      <button class="filter-button" style="background: #FFF1D1">Paintings</button>
      <button class="filter-button" style="background: #DF301C">Sculptures</button>
    </div>

    <main>
      <div class="grid">
        <div class="card">
          <img src="https://picsum.photos/seed/art1/400/400" alt="" />
          <p class="caption">Untitled #1</p>
        </div>
        <div class="card">
          <img src="https://picsum.photos/seed/art2/400/400" alt="" />
          <p class="caption">Untitled #2</p>
        </div>
        <div class="card">
          <img src="https://picsum.photos/seed/art3/400/400" alt="" />
          <p class="caption">Untitled #3</p>
        </div>
        <div class="card">
          <img src="https://picsum.photos/seed/art4/400/400" alt="" />
          <p class="caption">Untitled #4</p>
        </div>
        <div class="card">
          <img src="https://picsum.photos/seed/art5/400/400" alt="" />
          <p class="caption">Untitled #5</p>
        </div>
        <div class="card">
          <img src="https://picsum.photos/seed/art6/400/400" alt="" />
          <p class="caption">Untitled #6</p>
        </div>
        <div class="card">
          <img src="https://picsum.photos/seed/art7/400/400" alt="" />
          <p class="caption">Untitled #7</p>
        </div>
        <div class="card">
          <img src="https://picsum.photos/seed/art8/400/400" alt="" />
          <p class="caption">Untitled #8</p>
        </div>
        <div class="card">
          <img src="https://picsum.photos/seed/art9/400/400" alt="" />
          <p class="caption">Untitled #9</p>
        </div>
      </div>
    </main>
  </body>
</html>
