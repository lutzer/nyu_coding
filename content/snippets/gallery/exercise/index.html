<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Gallery — starter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <img class="logo" src="logo.svg" alt="Gallery" />
      <nav>
        <a href="#">Works</a>
        <a href="#">Artists</a>
        <a href="#">About</a>
        <a href="#">Visit</a>
      </nav>
    </header>

    <section class="hero">
      <h1>Augmenting the Gallery</h1>
      <p>A hybrid space for artworks</p>
    </section>

    <div class="filters">
      <button>All</button>
      <button>Painting</button>
      <button>Sculpture</button>
    </div>

    <main>
      <div class="grid">
        <figure class="card">
          <img src="https://picsum.photos/seed/art1/400/400" alt="" />
          <figcaption>Untitled #1</figcaption>
        </figure>
        <figure class="card">
          <img src="https://picsum.photos/seed/art2/400/400" alt="" />
          <figcaption>Untitled #2</figcaption>
        </figure>
        <figure class="card">
          <img src="https://picsum.photos/seed/art3/400/400" alt="" />
          <figcaption>Untitled #3</figcaption>
        </figure>
        <figure class="card">
          <img src="https://picsum.photos/seed/art4/400/400" alt="" />
          <figcaption>Untitled #4</figcaption>
        </figure>
        <figure class="card">
          <img src="https://picsum.photos/seed/art5/400/400" alt="" />
          <figcaption>Untitled #5</figcaption>
        </figure>
        <figure class="card">
          <img src="https://picsum.photos/seed/art6/400/400" alt="" />
          <figcaption>Untitled #6</figcaption>
        </figure>
        <figure class="card">
          <img src="https://picsum.photos/seed/art7/400/400" alt="" />
          <figcaption>Untitled #7</figcaption>
        </figure>
        <figure class="card">
          <img src="https://picsum.photos/seed/art8/400/400" alt="" />
          <figcaption>Untitled #8</figcaption>
        </figure>
        <figure class="card">
          <img src="https://picsum.photos/seed/art9/400/400" alt="" />
          <figcaption>Untitled #9</figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
